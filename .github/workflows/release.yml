name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download fastText model
        run: make download-model

      - name: Run tests
        run: go test -race ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install from source

            Download the source archive below, extract, and run:

            ```bash
            make download-model  # optional: fastText language detection
            make install
            ```

            Requires Go 1.26+ with CGO enabled (the default).
