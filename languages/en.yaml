  impl_short_constraint: "Focus on the immediate next step only"
  opt_deep_scope: "Include benchmarking methodology"
  beginner_deep_context: "Provide depth while maintaining accessibility."
  advanced_short_constraint: "Be concise but assume full technical background"
  beginner_technical_constraint: "Define technical terms before using them"

